<section class="forest-auth">
  <div class="forest-auth-card">
    <span class="forest-eyebrow">Forest · Acesso</span>
    <div class="forest-title-row">
      <div class="forest-title-icon"><i class="bi bi-shield-lock"></i></div>
      <h1 class="forest-title">Nova senha</h1>
    </div>

    <ng-container *ngIf="!linkInvalido; else invalido">
      <p class="forest-auth-text">Crie uma nova senha para a sua conta.</p>

      <form (ngSubmit)="resetPassword()">
        <div class="forest-auth-fields">
          <div class="forest-form-group">
            <label for="password">Nova senha</label>
            <input [type]="mostrarSenha ? 'text' : 'password'" id="password" name="password" class="forest-input"
              autocomplete="new-password" [(ngModel)]="password" required />
          </div>
          <div class="forest-form-group">
            <label for="confirmPassword">Confirme a nova senha</label>
            <input [type]="mostrarSenha ? 'text' : 'password'" id="confirmPassword" name="confirmPassword"
              class="forest-input" autocomplete="new-password" [(ngModel)]="confirmPassword" required />
          </div>
          <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="mostrarSenha" name="mostrarSenha"
              [(ngModel)]="mostrarSenha" />
            <label class="form-check-label" for="mostrarSenha">Mostrar senha</label>
          </div>
        </div>

        <button type="submit" class="forest-btn forest-btn-primary w-100" [disabled]="enviando">
          <span *ngIf="enviando" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          {{ enviando ? 'Salvando...' : 'Salvar nova senha' }}
        </button>
      </form>
    </ng-container>

    <ng-template #invalido>
      <div class="forest-auth-notice forest-auth-notice-erro" role="alert">
        <i class="bi bi-exclamation-triangle"></i>
        <span>Este link é inválido, expirou ou já foi usado. Peça um novo link de redefinição.</span>
      </div>
      <a routerLink="/forgotPassword" class="forest-btn forest-btn-primary w-100 text-decoration-none">
        Pedir novo link
      </a>
    </ng-template>

    <p class="forest-auth-footer"><a routerLink="/login">Voltar ao login</a></p>
  </div>
</section>
